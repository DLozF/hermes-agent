services:
  gateway:
    # image: nousresearch/hermes-agent:latest
    build:
      context: .
      dockerfile: Dockerfile_hsep
    container_name: hermes
    restart: unless-stopped
    gpus: all

    volumes:
      - ../hermes_files/data:/opt/data
      - ../hermes_files/ai_files:/opt/ai_files
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_WRITE_SAFE_ROOT=/opt/ai_files
    # command: ["gateway", "run"]
    networks:
      - backend

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    gpus: all
  
    depends_on:
      - gateway
    volumes:
      - ../hermes_files/data:/opt/data
      - ../hermes_files/ai_files:/opt/ai_files
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD=1
      - HERMES_WRITE_SAFE_ROOT=/opt/ai_files
    ports:
      - "9119:9119"
    networks:
      - backend
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]

networks:
  backend:
    driver: bridge