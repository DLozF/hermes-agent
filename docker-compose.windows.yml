services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ../hermes_files/data:/opt/data
      - ../hermes_files/ai_files:/opt/ai_files
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_WRITE_SAFE_ROOT=/opt/ai_files
    command: ["gateway", "run"]
    networks:
      - backend

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ../hermes_files/data:/opt/data
      - ../hermes_files/ai_files:/opt/ai_files
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD_HOST=127.0.0.1
      - HERMES_WRITE_SAFE_ROOT=/opt/ai_files
    ports:
      - "127.0.0.1:9119:9119"
    networks:
      - backend
    command: ["dashboard", "--host", "127.0.0.1", "--port", "9119", "--no-open"]

networks:
  backend:
    driver: bridge
