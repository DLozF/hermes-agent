services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
    command: ["gateway", "run"]
    networks:
      - backend

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_DASHBOARD_HOST=127.0.0.1
    ports:
      - "127.0.0.1:9119:9119"
    networks:
      - backend
    command: ["dashboard", "--host", "127.0.0.1", "--port", "9119", "--no-open"]

networks:
  backend:
    # external: true
    name: ollama-firecrawl_backend